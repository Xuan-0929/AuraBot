[project]
name = "aurabot-backend"
version = "0.1.0"
description = "AuraBot Python gateway and microservice workspace."
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115.0",
  "httpx>=0.28.0",
  "PyYAML>=6.0",
  "qdrant-client>=1.18.0",
  "uvicorn[standard]>=0.32.0"
]

[project.optional-dependencies]
speech = [
  "dashscope>=1.25.0",
  "numpy>=1.26.0",
  "onnxruntime>=1.20.0",
  "transformers>=4.48.0"
]

[tool.uv]
package = false
