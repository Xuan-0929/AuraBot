<!--
  Hosts the dependency-free aurabot.main-agent.v1 browser exerciser. Vite builds it beside the main
  renderer so developers can inspect session state, microphone/TTS worklets, and protocol faults without
  placing diagnostic controls in the production AuraBot interface.
-->
<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>AuraBot Realtime Protocol Lab</title>
    <link rel="stylesheet" href="/src/realtime-test-client/style.css" />
  </head>
  <body>
    <main>
      <header>
        <p class="eyebrow">aurabot.main-agent.v1</p>
        <h1>Realtime Protocol Lab</h1>
        <p>One renderer lease, exact PCM framing, and deliberately breakable controls.</p>
      </header>

      <section class="connection">
        <label>Gateway <input id="gateway" value="http://127.0.0.1:6401" /></label>
        <label>Capability <input id="token" placeholder="acquire or paste one-shot token" /></label>
        <button id="acquire">Acquire token</button>
        <button id="connect">Connect</button>
        <span id="status" data-state="offline">offline</span>
      </section>

      <section class="grid">
        <article>
          <h2>Input</h2>
          <div class="row">
            <button id="voice-mode">Voice mode</button><button id="text-mode">Text mode</button>
            <button id="mic-start">Start mic</button><button id="mic-stop">Stop mic</button>
          </div>
          <label>Text / normalized transcript
            <textarea id="text" rows="4" placeholder="Type a desktop submission or confirmed transcript"></textarea>
          </label>
          <div class="row">
            <button id="submit-text">Submit text</button>
            <button id="candidate">Speech candidate</button>
            <button id="rejected">Reject candidate</button>
            <button id="confirmed">Confirm complete</button>
          </div>
        </article>

        <article>
          <h2>Faults</h2>
          <p>Each frame/epoch fault is one-shot. Backpressure sends 80 silent mic frames immediately.</p>
          <div class="faults">
            <button data-fault="gap">Gap</button><button data-fault="duplicate">Duplicate</button>
            <button data-fault="badEpoch">Bad epoch</button><button data-fault="backpressure">Backpressure</button>
          </div>
          <h2>Renderer</h2>
          <pre id="clause">No clause offered.</pre>
          <div class="row"><button id="ack-complete">ACK complete</button><button id="ack-partial">ACK interrupted</button></div>
        </article>
      </section>

      <section>
        <div class="timeline-heading"><h2>Authoritative timeline</h2><button id="clear">Clear</button></div>
        <ol id="timeline"></ol>
      </section>
    </main>
    <script type="module" src="/src/realtime-test-client/main.ts"></script>
  </body>
</html>
