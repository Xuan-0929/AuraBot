[project]
name = "aurabot-native-mcp"
version = "0.1.0"
description = "AuraBot native Streamable HTTP MCP server."
requires-python = ">=3.12"
dependencies = [
  "bashlex>=0.18,<1",
  "jsonschema>=4.23",
  "httpx>=0.27",
  "mcp>=1.28.1,<2",
  "PyYAML>=6.0",
]

[dependency-groups]
dev = [
  "pytest>=8.3",
  "pytest-asyncio>=0.24",
]

[tool.uv]
package = false

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
pythonpath = ["."]
