# AuraBot Python Backend configuration example.
#
# Copy this file to config.yaml. The Backend exposes health plus the Python Pi
# Task REST/SSE vertical slice; model sections remain for future chat/Memory
# integration. The task section is unrelated to removed legacy task_runtime,
# task_model, or local_mcp_server fields.

ports:
  frontend: 6400
  backend_gateway: 6401

app:
  data_dir: "${AURABOT_USER_DATA_DIR:-./.aurabot-data}"
  workspaces:
    - id: default
      path: "."

main_agent:
  profile_dir: profiles

memory: {}

dev: {}

chat_model:
  base_url: "https://api.deepseek.com/v1"
  model_name: "deepseek-v4-flash"
  api_key: "${AURABOT_CHAT_MODEL_API_KEY:-}"

gateway_model:
  base_url: "https://api.deepseek.com/v1"
  model_name: "deepseek-v4-flash"
  api_key: "${AURABOT_GATEWAY_MODEL_API_KEY:-}"

task:
  user_data_dir: "${AURABOT_USER_DATA_DIR:-./.aurabot-data}"
  pi_runtime_dir: "${AURABOT_PI_RUNTIME_DIR:-./pi-runtime}"
  node_executable: "${AURABOT_NODE_EXECUTABLE:-node}"
  default_timeout_seconds: 1800
