# AuraBot Python Backend configuration example.
#
# Copy this file to config.yaml. The Backend composes Main Agent, automatic
# Memory, realtime/speech, and the Python Pi Task control plane in one lifespan.
# The task section is unrelated to removed legacy task_runtime, task_model, or
# local_mcp_server fields.

ports:
  frontend: 6400
  backend_gateway: 6401

app:
  data_dir: "${AURABOT_USER_DATA_DIR:-./.aurabot-data}"
  workspaces:
    - id: default
      path: "."

main_agent:
  profile_id: default
  profile_dir: profiles
  # Web tools are exposed to the model only when this key is configured.
  # Search and read share one opaque SourceRegistry; no key keeps both absent.
  web:
    tavily_api_key: "${TAVILY_API_KEY:-}"
  # Speech remains disabled by default and does not probe optional providers.
  speech:
    enabled: false
    api_key: "${DASHSCOPE_API_KEY:-}"
    stt_model_name: fun-asr-realtime
    tts_model_name: cosyvoice-v3-flash
    tts_voice: longanyang
    silero_model_path: assets/models/silero-vad.onnx
    silero_license_path: assets/licenses/silero-vad.txt
    smart_turn_model_path: assets/models/smart-turn-v3.2.onnx
    smart_turn_license_path: assets/licenses/smart-turn-v3.2.txt

memory:
  # Local deterministic embeddings keep default startup offline-safe. Durable
  # SQLite truth and the embedded Qdrant collection live inside the profile.
  embedding:
    provider: hash
    dimension: 384

dev: {}

chat_model:
  base_url: "https://api.deepseek.com/v1"
  model_name: "deepseek-v4-flash"
  api_key: "${AURABOT_CHAT_MODEL_API_KEY:-}"
  timeout_seconds: 60

gateway_model:
  base_url: "https://api.deepseek.com/v1"
  model_name: "deepseek-v4-flash"
  api_key: "${AURABOT_GATEWAY_MODEL_API_KEY:-}"

task:
  user_data_dir: "${AURABOT_USER_DATA_DIR:-./.aurabot-data}"
  pi_runtime_dir: "${AURABOT_PI_RUNTIME_DIR:-./pi-runtime}"
  node_executable: "${AURABOT_NODE_EXECUTABLE:-node}"
  default_timeout_seconds: 1800
