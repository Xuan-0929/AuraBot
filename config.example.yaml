# AuraBot Python Backend configuration example.
#
# Copy this file to config.yaml. The current Backend is health-only; the model
# sections are retained for future chat/Memory integration and are not used by
# a Task runtime.

ports:
  frontend: 6400
  backend_gateway: 6401

chat_model:
  base_url: "https://api.deepseek.com/v1"
  model_name: "deepseek-v4-flash"
  api_key: "${AURABOT_CHAT_MODEL_API_KEY:-}"

gateway_model:
  base_url: "https://api.deepseek.com/v1"
  model_name: "deepseek-v4-flash"
  api_key: "${AURABOT_GATEWAY_MODEL_API_KEY:-}"
