# Source compatibility checks only: exercises Windows handles/processes and the desktop build.
# Does not create installers, sign, publish, or require model credentials.
name: Windows compatibility
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  windows:
    runs-on: windows-2022
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - run: python -m pip install uv
      - run: uv sync --project backend --frozen
      - name: Backend platform regressions
        env:
          AURABOT_CONFIG_PATH: backend/tests/fixtures/runtime_config.json
        run: uv run --project backend --no-sync python -m unittest backend.tests.test_windows_compatibility backend.tests.test_main_agent_observations backend.tests.task.test_settings backend.tests.task.test_process backend.tests.test_main_agent_tool_runtime
      - run: npm ci --prefix frontend
      - name: Install source Pi runtime and exercise offline RPC
        env:
          AURABOT_CONFIG_PATH: backend/tests/fixtures/runtime_config.json
        run: |
          node frontend/scripts/install-runtime.mjs .
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          uv run --project backend --no-sync python -m unittest backend.tests.task.test_real_pi_smoke
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Launcher and desktop regressions
        working-directory: frontend
        run: |
          npm run test:scripts
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          npx vitest run --config configs/vitest.config.ts tests/unit/main/backendProcess.spec.ts tests/unit/main/installationDefaults.spec.ts tests/unit/renderer/settingsLayout.spec.ts
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - run: npm run build --prefix frontend
